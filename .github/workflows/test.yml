name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS minutes cost more, so plain pushes test Linux only; pull requests
        # and manual runs test both.
        os: ${{ github.event_name == 'push' && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: system packages (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-noto-cjk
      - name: system packages (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg && brew install --cask font-noto-sans-cjk
      - name: engine
        run: python3 -m unittest discover -s engine/tests
      - name: tts
        run: uv run --no-project --with numpy python3 -m unittest discover -s tools/tts/tests
      # The sample game's web replay, built as a reader would with
      # scripts/sample-replay.sh, then the replay tests on it. The tests draw
      # frames, so check first that they get the CJK fonts.
      - name: replay of the sample game
        run: |
          uv run --no-project --with pillow python -c 'import sys; sys.path.insert(0, "tools/replay"); import render
          for bold, style in ((False, "Regular"), (True, "Bold")):
              name = render.font(20, bold).getname(); print(name); assert "CJK" in name[0] and name[1] == style, name'
          scripts/sample-replay.sh
          (cd tools/replay && WW_REPLAY_GAME="$GITHUB_WORKSPACE/games/sample" uv run --no-project --with pillow python -m unittest test_replay)
